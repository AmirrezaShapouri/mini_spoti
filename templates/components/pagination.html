{% if page_obj and page_obj.has_other_pages %}
    <nav class="pagination" aria-label="Pagination">
        {% if page_obj.has_previous %}
            <a class="button button-outline" href="?page={{ page_obj.previous_page_number }}" aria-label="Previous page">Previous</a>
        {% endif %}
        <span>Page {{ page_obj.number }} of {{ page_obj.paginator.num_pages }}</span>
        {% if page_obj.has_next %}
            <a class="button button-outline" href="?page={{ page_obj.next_page_number }}" aria-label="Next page">Next</a>
        {% endif %}
    </nav>
{% endif %}
