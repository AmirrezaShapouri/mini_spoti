<div class="song-row">
    <div class="song-row-main">
        <button
            type="button"
            class="row-play"
            data-audio="{{ song.audio_file.url }}"
            data-title="{{ song.title }}"
            data-artist="{{ song.artist.name }}"
            data-cover="{% if song.cover %}{{ song.cover.url }}{% elif song.album and song.album.cover %}{{ song.album.cover.url }}{% endif %}"
            aria-label="Play {{ song.title }}"
        >
            <span class="play-icon">▶</span>
        </button>

        <div class="song-cover">
            {% if song.cover %}
                <img
                    src="{{ song.cover.url }}"
                    alt="{{ song.title }}"
                    loading="lazy"
                >
            {% elif song.album and song.album.cover %}
                <img
                    src="{{ song.album.cover.url }}"
                    alt="{{ song.album.title }}"
                    loading="lazy"
                >
            {% else %}
                <img
                    src="/static/images/album-placeholder.svg"
                    alt="Default album cover"
                    loading="lazy"
                >
            {% endif %}
        </div>

        <div class="song-info">
            <a
                href="{% url 'music:song_detail' song.slug %}"
                class="song-title"
            >
                {{ song.title }}
            </a>

            <a
                href="{% if song.artist.slug %}#{% else %}#{% endif %}"
                class="song-artist"
            >
                {{ song.artist.name }}
            </a>
        </div>
    </div>

    <div class="song-row-album">
        {% if song.album %}
            {{ song.album.title }}
        {% else %}
            <span class="muted-text">Single</span>
        {% endif %}
    </div>

    <div class="song-row-actions">
        {% if user.is_authenticated %}
            <button
                type="button"
                class="row-favorite{% if song.id in favorite_song_ids %} is-favorite{% endif %}"
                data-song-slug="{{ song.slug }}"
                aria-label="{% if song.id in favorite_song_ids %}Remove from favorites{% else %}Add to favorites{% endif %}"
                aria-pressed="{% if song.id in favorite_song_ids %}true{% else %}false{% endif %}"
            >
                <span class="favorite-icon">{% if song.id in favorite_song_ids %}♥{% else %}♡{% endif %}</span>
            </button>
        {% else %}
            <a
                href="{% url 'accounts:login' %}"
                class="row-favorite"
                aria-label="Log in to add this song to favorites"
            >
                <span class="favorite-icon">♡</span>
            </a>
        {% endif %}

        <span class="track-duration">
            {{ song.duration_display }}
        </span>
    </div>
</div>
