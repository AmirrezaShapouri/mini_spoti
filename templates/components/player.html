{% load static %}

<div class="player-bar" id="music-player">
    <div class="player-track">
        <img
            src="{% static 'images/album-placeholder.svg' %}"
            alt="Song cover"
            class="player-cover"
        >

        <div class="player-track-info">
            <strong class="player-title">No song selected</strong>
            <span class="player-artist">Choose a song to start listening</span>
        </div>


    </div>

    <div class="player-controls">
        <div class="player-buttons">
            <button
                type="button"
                class="player-button player-play-button"
                aria-label="Play or pause"
            >
                ▶
            </button>
        </div>

        <div class="progress-row">
            <span class="player-current-time">0:00</span>

            <input
                type="range"
                class="player-progress"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Playback progress"
            >

            <span class="player-duration">0:00</span>
        </div>
    </div>

    <div class="player-extra">
        <span class="player-status">Ready to play</span>
    </div>

    <form hidden>
        {% csrf_token %}
    </form>
</div>
