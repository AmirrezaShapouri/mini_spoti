{% load static %}

<div class="player" id="music-player">
    <div class="player-info">
        <div class="player-cover">
            <img
                src="{% static 'images/album-placeholder.svg' %}"
                alt="Song cover"
                class="player-cover-image"
            >
        </div>

        <div class="player-track-info">
            <strong class="player-title">No song selected</strong>
            <span class="player-artist">Select a song to play</span>
        </div>
    </div>

    <div class="player-center">
        <div class="player-controls">
            <button
                type="button"
                class="player-play-button"
                aria-label="Play or pause"
            >
                ▶
            </button>
        </div>

        <div class="player-timeline">
            <span class="player-current-time">0:00</span>

            <input
                type="range"
                class="player-progress"
                min="0"
                max="100"
                value="0"
                step="0.1"
                aria-label="Playback progress"
            >

            <span class="player-duration">0:00</span>
        </div>
    </div>

    <div class="player-extra">
        <span class="player-status">Ready to play</span>
    </div>
</div>
