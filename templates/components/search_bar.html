<form
    class="top-search{% if request.resolver_match.url_name == 'search' %} search-focused{% endif %}"
    action="{% url 'music:search' %}"
    method="get"
    role="search"
>
    <span class="search-icon" aria-hidden="true">⌕</span>

    <input
        type="search"
        name="q"
        value="{{ request.GET.q|default:'' }}"
        placeholder="Search songs, artists, and albums"
        aria-label="Search songs, artists, and albums"
        autocomplete="off"
        {% if request.resolver_match.url_name == 'search' %}autofocus{% endif %}
    >
</form>
