{% load static %}
{# TODO: Replace the placeholder href with a named album-detail URL when one exists. #}
<a class="music-card" href="{% url 'music:album_detail' album.slug %}">
    {% if album.cover %}
        <img src="{{ album.cover.url }}" alt="{{ album.title }}">
    {% else %}
        <img src="{% static 'images/album-placeholder.svg' %}" alt="">
    {% endif %}
    <strong>{{ album.title }}</strong>
    <span>{{ album.artist.name }}</span>
    {% if album.release_date %}<small>{{ album.release_date|date:"Y" }}</small>{% endif %}
</a>
