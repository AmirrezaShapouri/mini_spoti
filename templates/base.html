<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Mini Spoti - A simple music streaming platform.">
    <title>Mini Spoti</title>
    <link rel="stylesheet" href="static/css/style.css">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar">
            <div class="brand">
                <div class="brand-mark">M</div>
                <span>Mini Spoti</span>
            </div>

            <nav class="main-nav" aria-label="Main navigation">
                <a class="nav-link active" href="home.html">
                    <span class="nav-icon">⌂</span>
                    <span>Home</span>
                </a>
                <a class="nav-link" href="search.html">
                    <span class="nav-icon">⌕</span>
                    <span>Search</span>
                </a>
                <a class="nav-link" href="favorites.html">
                    <span class="nav-icon">♥</span>
                    <span>Liked Songs</span>
                </a>
            </nav>

            <div class="sidebar-divider"></div>

            <div class="sidebar-section">
                <div class="sidebar-heading">
                    <span>Your Library</span>
                    <button class="icon-button small" aria-label="Create playlist">+</button>
                </div>
                <a class="library-item" href="albums.html">Albums</a>
                <a class="library-item" href="artists.html">Artists</a>
            </div>

            <div class="sidebar-footer">
                <a href="login.html" class="text-link">Log in</a>
                <a href="register.html" class="button button-outline full-width">Sign up</a>
            </div>
        </aside>

        <main class="main-content">
            <header class="topbar">
                <div class="history-buttons">
                    <button class="circle-button" aria-label="Go back">‹</button>
                    <button class="circle-button" aria-label="Go forward">›</button>
                </div>

                <form class="top-search" action="search.html">
                    <span class="search-icon">⌕</span>
                    <input type="search" name="q" placeholder="What do you want to play?" aria-label="Search">
                </form>

                <div class="topbar-actions">
                    <a href="login.html" class="text-link desktop-only">Log in</a>
                    <a href="register.html" class="button button-primary">Sign up</a>
                </div>
            </header>

            <section class="page-content">
                <!-- Page-specific content goes here. -->
                <div class="empty-state">
                    <div class="empty-icon">♪</div>
                    <h1>Mini Spoti</h1>
                    <p>Your music, your way.</p>
                </div>
            </section>
        </main>
    </div>

    <div class="player-bar">
        <div class="player-track">
            <img src="static/images/album-placeholder.svg" alt="Album cover" class="player-cover">
            <div class="player-track-info">
                <strong>Midnight Drive</strong>
                <span>Nova Echo</span>
            </div>
            <button class="like-button" aria-label="Like song">♡</button>
        </div>

        <div class="player-controls">
            <div class="player-buttons">
                <button class="player-button" aria-label="Shuffle">⤨</button>
                <button class="player-button" aria-label="Previous">◀</button>
                <button class="play-button" aria-label="Play">▶</button>
                <button class="player-button" aria-label="Next">▶</button>
                <button class="player-button" aria-label="Repeat">↻</button>
            </div>
            <div class="progress-row">
                <span>0:42</span>
                <input type="range" min="0" max="100" value="28" aria-label="Song progress">
                <span>3:41</span>
            </div>
        </div>

        <div class="player-extra">
            <button class="player-button" aria-label="Queue">☷</button>
            <button class="player-button" aria-label="Volume">🔊</button>
            <input class="volume-slider" type="range" min="0" max="100" value="75" aria-label="Volume">
        </div>
    </div>

    <script src="static/js/app.js"></script>
</body>
</html>
